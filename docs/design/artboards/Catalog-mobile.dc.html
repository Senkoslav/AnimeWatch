<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Каталог на телефоне — AnimeWatch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@600;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Golos Text',system-ui,sans-serif;background:#0B0E13;color:#EDF1F7}
a{color:#EDF1F7;text-decoration:none;text-underline-offset:0.2em;text-decoration-thickness:from-font}
a:hover{color:#FFFFFF}
::selection{background:#4A3410;color:#FFFFFF}
:root{caret-color:#FFB02E;scrollbar-color:#2A313D #0B0E13;scrollbar-width:thin}
:where(time,output,[data-numeric]){font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid #FFB02E;outline-offset:2px}
::placeholder{color:#8A94A4;opacity:1}
</style>
</helmet>

<div style="width: 390px; height: 1480px; background: #0B0E13; position: relative; overflow: hidden;">

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column;">
    <header style="height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: rgba(14,18,25,0.78); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08);">
      <a href="Home-mobile.dc.html" aria-label="Назад" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px;"><svg viewBox="0 0 24 24" fill="none" stroke="#EDF1F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;"><path d="M14 6l-6 6 6 6"></path></svg></a>
      <span style="font-family: Unbounded, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: -0.02em;">Каталог</span>
      <span style="font-size: 13px; color: #8A94A4;">348</span>
      <a href="Catalog-mobile.dc.html" aria-label="Поиск" style="margin-left: auto; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px;"><svg viewBox="0 0 24 24" fill="none" stroke="#EDF1F7" stroke-width="2" style="width: 19px; height: 19px;"><circle cx="11" cy="11" r="6"></circle><line x1="15.5" y1="15.5" x2="20" y2="20" stroke-linecap="round"></line></svg></a>
    </header>

    <div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; overflow: hidden;">
      <span style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 12px; background: {{accent}}; color: {{accentInk}}; font-size: 13px; font-weight: 600; flex-shrink: 0;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width: 15px; height: 15px;"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Фильтры 2
      </span>
      <span style="display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 12px; border-radius: 12px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); font-size: 13px; flex-shrink: 0;">Драма<svg viewBox="0 0 16 16" fill="none" stroke="#8A94A4" stroke-width="2" stroke-linecap="round" style="width: 12px; height: 12px;"><path d="M4 4l8 8M12 4l-8 8"></path></svg></span>
      <span style="display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 12px; border-radius: 12px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); font-size: 13px; flex-shrink: 0;">Выходит<svg viewBox="0 0 16 16" fill="none" stroke="#8A94A4" stroke-width="2" stroke-linecap="round" style="width: 12px; height: 12px;"><path d="M4 4l8 8M12 4l-8 8"></path></svg></span>
    </div>

    <div style="padding: 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
      <sc-for list="{{cards}}" as="item" hint-placeholder-count="6">
        <a href="Title.dc.html" style="display: flex; flex-direction: column; gap: 9px;">
          <span style="position: relative; display: block; aspect-ratio: 2 / 3; border-radius: 13px; overflow: hidden; border: 1px solid rgba(255,255,255,0.09); background: {{item.art}};">
            <span style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,14,19,0) 58%, rgba(11,14,19,0.8));"></span>
            <span style="position: absolute; left: 8px; top: 8px; display: inline-flex; align-items: center; height: 23px; padding: 0 8px; border-radius: 7px; background: rgba(11,14,19,0.62); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.16); font-size: 11px; font-weight: 600; color: #FFFFFF;">{{item.score}}</span>
            <span style="position: absolute; left: 8px; bottom: 7px; font-size: 11px; color: #C9D2DD;">{{item.ep}}</span>
          </span>
          <span style="font-size: 13px; line-height: 1.3; font-weight: 500; height: 34px; overflow: hidden;">{{item.name}}</span>
          <span style="display: flex; align-items: center; justify-content: space-between; padding-top: 7px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: #8A94A4;">{{item.meta}}<span style="color: {{item.stateColor}};">{{item.state}}</span></span>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(8,10,14,0.62); backdrop-filter: blur(6px);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 860px; border-radius: 26px 26px 0 0; border: 1px solid rgba(255,255,255,0.14); border-bottom: none; background: rgba(20,25,33,0.9); backdrop-filter: blur(34px) saturate(160%); box-shadow: 0 -20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.13); display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; padding: 10px 0 4px;"><span style="width: 42px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.22);"></span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 8px 18px 14px; border-bottom: 1px solid rgba(255,255,255,0.08);">
      <h2 style="margin: 0; font-family: Unbounded, sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -0.02em;">Отбор</h2>
      <a href="Catalog-mobile.dc.html" style="margin-left: auto; display: inline-flex; align-items: center; height: 44px; font-size: 13px; color: #8A94A4;">Сбросить</a>
      <button type="button" aria-label="Закрыть" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); cursor: pointer;"><svg viewBox="0 0 24 24" fill="none" stroke="#C9D2DD" stroke-width="2" stroke-linecap="round" style="width: 16px; height: 16px;"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <div style="flex-grow: 1; padding: 18px; display: flex; flex-direction: column; gap: 22px;">
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <label for="m-q" style="font-size: 13px; font-weight: 500; color: #C9D2DD;">Название</label>
        <input id="m-q" type="search" placeholder="Например, Фрирен" style="width: 100%; height: 48px; padding: 0 14px; border-radius: 13px; border: 1px solid rgba(255,255,255,0.12); background: rgba(11,14,19,0.6); color: #EDF1F7; font-family: inherit; font-size: 16px;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 13px; font-weight: 500; color: #C9D2DD;">Жанр</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <sc-for list="{{genres}}" as="g" hint-placeholder-count="8">
            <label style="display: inline-flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 13px; border: 1px solid {{g.line}}; background: {{g.fill}}; color: {{g.color}}; font-size: 14px; font-weight: 500;"><input type="checkbox" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">{{g.name}}</label>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 13px; font-weight: 500; color: #C9D2DD;">Статус</span>
        <div style="display: flex; padding: 4px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.10); background: rgba(11,14,19,0.55); gap: 4px;">
          <label style="flex-grow: 1; display: inline-flex; align-items: center; justify-content: center; height: 44px; border-radius: 11px; font-size: 14px; color: #99A4B4;"><input type="radio" name="m-status" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Любой</label>
          <label style="flex-grow: 1; display: inline-flex; align-items: center; justify-content: center; height: 44px; border-radius: 11px; background: {{accentSoft}}; border: 1px solid {{accentLine}}; color: {{accent}}; font-size: 14px; font-weight: 600;"><input type="radio" name="m-status" checked style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Выходит</label>
          <label style="flex-grow: 1; display: inline-flex; align-items: center; justify-content: center; height: 44px; border-radius: 11px; font-size: 14px; color: #99A4B4;"><input type="radio" name="m-status" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Вышло</label>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 13px; font-weight: 500; color: #C9D2DD;">Год выхода</span>
        <div style="display: flex; align-items: center; gap: 10px;">
          <label for="m-y1" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Год от</label>
          <select id="m-y1" style="flex-grow: 1; height: 48px; padding: 0 14px; border-radius: 13px; border: 1px solid rgba(255,255,255,0.12); background: rgba(11,14,19,0.6); color: #EDF1F7; font-family: inherit; font-size: 16px; appearance: none;"><option>2018</option></select>
          <span style="font-size: 14px; color: #8A94A4;">—</span>
          <label for="m-y2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Год до</label>
          <select id="m-y2" style="flex-grow: 1; height: 48px; padding: 0 14px; border-radius: 13px; border: 1px solid rgba(255,255,255,0.12); background: rgba(11,14,19,0.6); color: #EDF1F7; font-family: inherit; font-size: 16px; appearance: none;"><option>2026</option></select>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 13px; font-weight: 500; color: #C9D2DD;">Сортировка</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <label style="display: inline-flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 13px; background: {{accentSoft}}; border: 1px solid {{accentLine}}; color: {{accent}}; font-size: 14px; font-weight: 600;"><input type="radio" name="m-sort" checked style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">по популярности</label>
          <label style="display: inline-flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 13px; border: 1px solid rgba(255,255,255,0.12); color: #C9D2DD; font-size: 14px;"><input type="radio" name="m-sort" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">по оценке</label>
          <label style="display: inline-flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 13px; border: 1px solid rgba(255,255,255,0.12); color: #C9D2DD; font-size: 14px;"><input type="radio" name="m-sort" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">новые</label>
        </div>
      </div>
    </div>

    <div style="padding: 14px 18px 22px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(14,18,25,0.6);">
      <button type="submit" style="width: 100%; height: 54px; border-radius: 15px; border: none; background: {{accent}}; color: {{accentInk}}; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;">Показать 348 тайтлов</button>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB02E","options":["#FFB02E","#7CC4FF","#FF6B8A","#57D9A3"],"section":"Палитра"},"$preview":{"width":390,"height":1480}}'>
class Component extends DCLogic {
  renderVals() {
    const hex = this.props.accent || '#FFB02E';
    const s = hex.replace('#', '');
    const r = parseInt(s.slice(0, 2), 16), g = parseInt(s.slice(2, 4), 16), b = parseInt(s.slice(4, 6), 16);
    const soft = 'rgba(' + r + ', ' + g + ', ' + b + ', 0.14)';
    const line = 'rgba(' + r + ', ' + g + ', ' + b + ', 0.34)';
    const art = [
      '#453A5E',
      '#2F5148',
      '#3C2C4C',
      '#5A3327',
      '#2C4A50',
      '#55384A'
    ];
    const picked = ['Драма'];
    return {
      accent: hex,
      accentSoft: soft,
      accentLine: line,
      accentMuted: 'rgb(' + Math.round(r * 0.45 + 237 * 0.55) + ', ' + Math.round(g * 0.45 + 241 * 0.55) + ', ' + Math.round(b * 0.45 + 247 * 0.55) + ')',
      accentInk: '#17110A',
      genres: ['Экшен', 'Драма', 'Комедия', 'Фэнтези', 'Сёнэн', 'Романтика', 'Спорт', 'Детектив'].map((name) => ({
        name: name,
        fill: picked.indexOf(name) >= 0 ? soft : 'transparent',
        line: picked.indexOf(name) >= 0 ? line : 'rgba(255,255,255,0.12)',
        color: picked.indexOf(name) >= 0 ? hex : '#C9D2DD'
      })),
      cards: [
        ['Провожающая в последний путь Фрирен', '9.12', '7 из 28', '2023, ТВ', 'выходит'],
        ['Магическая битва', '8.64', '24 серии', '2020, ТВ', 'вышло'],
        ['Клинок, рассекающий демонов', '8.51', '3 из 12', '2019, ТВ', 'выходит'],
        ['Человек-бензопила', '8.42', '12 серий', '2022, ТВ', 'вышло'],
        ['Дандадан', '8.33', '5 из 12', '2024, ТВ', 'выходит'],
        ['Атака титанов', '9.02', '25 серий', '2013, ТВ', 'вышло']
      ].map((n, i) => ({
        name: n[0], score: n[1], ep: n[2], meta: n[3], state: n[4],
        stateColor: n[4] === 'выходит' ? hex : '#8A94A4',
        art: art[i % art.length]
      }))
    };
  }
}
</script>
</body>
</html>
