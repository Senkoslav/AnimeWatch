<!--
  Знак AnimeWatch: лигатура AW. Правая нога A — первый штрих W, перекладина A — янтарный сигнал.
  Строгая геометрия: штрихи одной толщины, концы срезаны горизонтально по линии букв (полоса 16–84),
  как у шрифта, а не скруглены. Исходник для иконок; в разметке сайта — components/site/logo-mark.tsx.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="band"><rect x="0" y="16" width="100" height="68"/></clipPath>
  </defs>
  <rect x="10" y="59" width="34" height="11" fill="#ffb02e"/>
  <polyline clip-path="url(#band)" points="7,90 27,10 47,90 59,48 71,90 93,6" fill="none" stroke="#edf1f7" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="butt"/>
</svg>
